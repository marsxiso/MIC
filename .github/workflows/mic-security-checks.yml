name: MIC security branch checks

on:
  push:
    branches:
      - feature/secure-first-login
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - run: npm audit --json > backend-npm-audit.json || true
      - run: node --check server.js
      - run: node --check auth.js
      - run: node --check scripts/bootstrap-admin.js
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-npm-audit
          path: backend/backend-npm-audit.json

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm audit --json > mobile-npm-audit.json || true
      - run: npx tsc --noEmit --strict --skipLibCheck --allowSyntheticDefaultImports --jsx react-native --target esnext --moduleResolution node App.tsx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-npm-audit
          path: mobile-npm-audit.json
