name: MIC security branch checks

permissions:
  contents: write

on:
  pull_request:
    branches:
      - main
      - feature/secure-first-login

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm audit fix --package-lock-only || true
      - run: npm ci
      - run: npm audit --json > backend-npm-audit.json || true
      - run: node --check server.js
      - run: node --check auth.js
      - run: node --check scripts/bootstrap-admin.js
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-npm-audit
          path: |
            backend/backend-npm-audit.json
            backend/package-lock.json

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install expo@~52.0.0
      - run: npx expo install --fix
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm audit fix --package-lock-only || true
      - run: npm ci
      - run: npx expo-doctor
      - run: npm audit --json > mobile-npm-audit.json || true
      - run: npx tsc --noEmit --strict --skipLibCheck --allowSyntheticDefaultImports --jsx react-native --target esnext --moduleResolution node App.tsx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-npm-audit
          path: |
            mobile-npm-audit.json
            package-lock.json

  lockfile-sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: [backend, mobile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install expo@~52.0.0
      - run: npx expo install --fix
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm audit fix --package-lock-only || true
      - run: npm --prefix backend install --package-lock-only --ignore-scripts
      - run: npm --prefix backend audit fix --package-lock-only || true
      - name: Commit refreshed lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json backend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles are already current"
          else
            git commit -m "chore: refresh dependency lockfiles"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
